# Codemagic 配置：DartNative 版 Android APK。
# 不是 Flutter 项目，Codemagic 新建应用时项目类型选「Other」，构建完全按这个文件走。
# 授权：在 Codemagic 的 Environment variables 里建分组 dartnative，加密变量 DN_LICENSE_KEY = dnk_...（不要写进仓库）。
workflows:
  android-apk:
    name: Android APK
    # 免费套餐只给 mac_mini_m2
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - dartnative
    scripts:
      # 官方安装脚本：解压到 ~/zero，首次运行会下载几百 MB 的引擎
      - name: 安装 DartNative SDK
        script: |
          curl -fsSL https://cdn.dartnative.com/install.sh | sh
          ls "$HOME/zero/bin"
          echo "PATH=$HOME/zero/bin:$PATH" >> $CM_ENV
      - name: Android SDK 36
        # sdkmanager 不在 PATH 里，用 Android SDK 目录下的完整路径
        script: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "使用 $SDKM"
          yes | "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: 环境检查
        script: |
          dn --version
          dn doctor || true
      - name: 依赖
        script: dn pub get
      # release 沿用 debug 签名（android/app/build.gradle.kts），出来的 apk 直接能装
      - name: 编译 release apk
        script: dn build apk --release --dart-define=DN_LICENSE_KEY=$DN_LICENSE_KEY
    artifacts:
      - build/app/outputs/dn-apk/*.apk
      - build/app/outputs/apk/release/*.apk

  ios-unsigned:
    name: iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - dartnative
    scripts:
      - name: 安装 DartNative SDK
        script: |
          curl -fsSL https://cdn.dartnative.com/install.sh | sh
          echo "PATH=$HOME/zero/bin:$PATH" >> $CM_ENV
      - name: 环境检查
        script: |
          dn --version
          dn doctor || true
      - name: 安装依赖
        script: dn pub get
      - name: 编译 iOS 未签名包
        # 失败时 dn 只打印笼统的“需要 Development Team”，真正的原因在 xcodebuild 日志里，
        # 所以先放行失败，把日志里的 error 行打出来，再用原退出码结束
        script: |
          STATUS=0
          dn build ios --release --no-codesign --dart-define=DN_LICENSE_KEY=$DN_LICENSE_KEY || STATUS=$?
          if [ "$STATUS" != "0" ]; then
            echo "=== dn build 失败(退出码 $STATUS)，加 -v 重跑一遍，取 xcodebuild 的真实错误 ==="
            xcodebuild -version || true
            dn -v build ios --release --no-codesign --dart-define=DN_LICENSE_KEY=$DN_LICENSE_KEY > /tmp/dn_verbose.log 2>&1 || true
            wc -l /tmp/dn_verbose.log
            grep -n -i -E "error:|requires a development team|signing for|provisioning" /tmp/dn_verbose.log | head -60 || true
            echo "--- 详细日志最后 60 行 ---"
            tail -60 /tmp/dn_verbose.log
          fi
          exit $STATUS
      # .ipa 其实就是把 Runner.app 放进 Payload 目录再 zip，和 Flutter 版 chirp_trip 的做法一致
      # 产物是未签名的 ipa，下载后用 Sideloadly / 爱思助手 拿自己的 Apple ID 签名再装
      - name: 打成 ipa
        script: |
          APP=$(find build/ios/iphoneos -maxdepth 2 -name "*.app" -type d | head -1)
          echo "使用 $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr chirp_trip_native.ipa Payload
    artifacts:
      - chirp_trip_native.ipa
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # 已签名的 iOS 包：用 Codemagic 里上传的证书和描述文件签名，产物是能直接装的 .ipa。
  # 准备：Codemagic 网页 Teams > Personal account > Code signing identities > iOS certificates / iOS provisioning profiles，
  # 上传 .p12（填密码）和 .mobileprovision，「Reference name」分别填 chirp_trip_cert 和 chirp_trip_profile（与下面保持一致）。
  # 描述文件的 Bundle ID 必须是 com.chirptrip.chirpTrip，并且包含你要装的设备（Ad Hoc / Development）。
  ios-signed:
    name: iOS 签名包
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - dartnative
      ios_signing:
        certificates:
          - chirp_trip_cert
        provisioning_profiles:
          - chirp_trip_profile
    scripts:
      - name: 安装 DartNative SDK
        script: |
          curl -fsSL https://cdn.dartnative.com/install.sh | sh
          echo "PATH=$HOME/zero/bin:$PATH" >> $CM_ENV
      - name: 环境检查
        script: |
          dn --version
          xcodebuild -version
      - name: 安装依赖
        script: dn pub get
      # 把证书导进临时钥匙串，并把描述文件写进 Xcode 工程；同时生成 /Users/builder/export_options.plist
      - name: 配置签名
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: 编译 iOS 签名包
        script: dn build ipa --release --export-options-plist=/Users/builder/export_options.plist --dart-define=DN_LICENSE_KEY=$DN_LICENSE_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
